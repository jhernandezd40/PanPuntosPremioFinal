<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera(${formulario.id == null} ? 'Nueva recompensa' : 'Editar recompensa')}"></head>
<body>
<nav th:replace="~{fragmentos/plantilla :: navegacion('fidelizacion')}"></nav>
<main class="container">
    <div th:replace="~{fragmentos/plantilla :: mensajes}"></div>

    <h1 class="h3 mb-3" th:text="${formulario.id == null} ? 'Nueva recompensa' : 'Editar recompensa'"></h1>

    <div class="card tarjeta p-4" style="max-width: 720px">
        <form th:action="${formulario.id == null} ? @{/fidelizacion/recompensas} : @{/fidelizacion/recompensas/{id}(id=${formulario.id})}"
              th:object="${formulario}" method="post" novalidate>
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label" for="nombre">Nombre *</label>
                    <input class="form-control" id="nombre" th:field="*{nombre}"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="puntosRequeridos">Puntos requeridos *</label>
                    <input type="number" min="1" class="form-control" id="puntosRequeridos" th:field="*{puntosRequeridos}"
                           th:classappend="${#fields.hasErrors('puntosRequeridos')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{puntosRequeridos}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="productoId">Producto entregado *</label>
                    <select class="form-select" id="productoId" th:field="*{productoId}"
                            th:classappend="${#fields.hasErrors('productoId')} ? 'is-invalid'">
                        <option value="">Seleccione...</option>
                        <option th:each="producto : ${productos}" th:value="${producto.id}"
                                th:text="'[' + ${producto.descripcionCategoria} + '] ' + ${producto.nombre}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{productoId}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="descripcion">Descripción</label>
                    <input class="form-control" id="descripcion" th:field="*{descripcion}"
                           th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{descripcion}"></div>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button class="btn btn-primario" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/fidelizacion}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
<th:block th:replace="~{fragmentos/plantilla :: scripts}"></th:block>
</body>
</html>
