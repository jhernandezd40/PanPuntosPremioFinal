<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera('Reportes')}"></head>
<body>
<nav th:replace="~{fragmentos/plantilla :: navegacion('reportes')}"></nav>
<main class="container">
    <div th:replace="~{fragmentos/plantilla :: mensajes}"></div>

    <h1 class="h3 mb-3">Reportes</h1>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="reporte : ${reportes}">
            <div class="card tarjeta p-4 h-100">
                <h2 class="h5" th:text="${reporte.titulo()}"></h2>
                <p class="text-muted small flex-grow-1" th:text="${reporte.descripcion()}"></p>
                <div class="d-flex gap-2">
                    <a class="btn btn-primario btn-sm" th:href="@{/reportes/{clave}(clave=${reporte.clave()})}">Ver reporte</a>
                    <a class="btn btn-outline-secondary btn-sm" th:href="@{/reportes/{clave}/pdf(clave=${reporte.clave()})}">PDF</a>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
<th:block th:replace="~{fragmentos/plantilla :: scripts}"></th:block>
</body>
</html>
