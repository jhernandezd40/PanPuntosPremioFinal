<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Pan, Puntos y Premios'">Pan, Puntos y Premios</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<nav th:fragment="navegacion(seccion)" class="navbar navbar-expand-lg navbar-dark barra-principal mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">🥪 Pan, Puntos y Premios</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${seccion == 'pedidos'} ? 'active'" th:href="@{/pedidos}">Pedidos</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${seccion == 'clientes'} ? 'active'" th:href="@{/clientes}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${seccion == 'productos'} ? 'active'" th:href="@{/productos}">Productos</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${seccion == 'inventario'} ? 'active'" th:href="@{/inventario}">Inventario</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${seccion == 'fidelizacion'} ? 'active'" th:href="@{/fidelizacion}">Fidelización</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${seccion == 'reportes'} ? 'active'" th:href="@{/reportes}">Reportes</a></li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="mensajes">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${advertencia}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <span th:text="${advertencia}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>

<footer th:fragment="pie" class="pie text-center text-muted py-4 mt-5">
    <small>Pan, Puntos y Premios · Sistema de Pedidos y Fidelización</small>
</footer>

<th:block th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</th:block>

</body>
</html>
