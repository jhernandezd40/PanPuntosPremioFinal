<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera('Detalle de cliente')}"></head>
<body>
<nav th:replace="~{fragmentos/plantilla :: navegacion('clientes')}"></nav>
<main class="container">
    <div th:replace="~{fragmentos/plantilla :: mensajes}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-start mb-3 gap-2">
        <div>
            <h1 class="h3 mb-1" th:text="${cliente.nombre}"></h1>
            <span class="text-muted" th:text="${cliente.identificador}"></span>
            <span class="badge ms-2" th:classappend="${cliente.activo} ? 'text-bg-success' : 'text-bg-secondary'"
                  th:text="${cliente.activo} ? 'Activo' : 'Inactivo'"></span>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-primario" th:if="${cliente.activo}" th:href="@{/pedidos/nuevo(clienteId=${cliente.id})}">+ Pedido</a>
            <a class="btn btn-outline-secondary" th:if="${cliente.activo}"
               th:href="@{/fidelizacion(identificador=${cliente.identificador})}">Canjear</a>
            <a class="btn btn-outline-primary" th:href="@{/clientes/{id}/editar(id=${cliente.id})}">Editar</a>
            <form th:action="@{/clientes/{id}/estado(id=${cliente.id},activo=${!cliente.activo})}" method="post">
                <button class="btn" type="submit" th:classappend="${cliente.activo} ? 'btn-outline-warning' : 'btn-outline-success'"
                        th:text="${cliente.activo} ? 'Desactivar' : 'Activar'"></button>
            </form>
            <form th:action="@{/clientes/{id}/eliminar(id=${cliente.id})}" method="post"
                  onsubmit="return confirm('¿Eliminar este cliente? Si tiene historial solo se desactivará.');">
                <button class="btn btn-outline-danger" type="submit">Eliminar</button>
            </form>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card tarjeta p-3 text-center h-100">
                <span class="text-muted small">Saldo de puntos</span>
                <span class="saldo-puntos" th:text="${cliente.puntos}">0</span>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card tarjeta p-3 h-100">
                <dl class="row mb-0">
                    <dt class="col-sm-4">Teléfono</dt><dd class="col-sm-8" th:text="${cliente.telefono} ?: '—'"></dd>
                    <dt class="col-sm-4">Correo</dt><dd class="col-sm-8" th:text="${cliente.correo} ?: '—'"></dd>
                    <dt class="col-sm-4">Registrado</dt>
                    <dd class="col-sm-8" th:text="${#temporals.format(cliente.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></dd>
                    <dt class="col-sm-4">Pedidos</dt><dd class="col-sm-8" th:text="${#lists.size(pedidos)}"></dd>
                </dl>
            </div>
        </div>
    </div>

    <ul class="nav nav-tabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#pestanaPedidos" type="button">Historial de pedidos</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#pestanaPuntos" type="button">Movimientos de puntos</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#pestanaCanjes" type="button">Canjes</button></li>
    </ul>
    <div class="tab-content card tarjeta border-top-0 rounded-top-0">
        <div class="tab-pane fade show active" id="pestanaPedidos">
            <div class="table-responsive">
                <table class="table tabla table-hover align-middle mb-0">
                    <thead><tr><th>#</th><th>Fecha</th><th>Estado</th><th class="text-end">Total</th><th class="text-end">Puntos</th><th></th></tr></thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="6" class="text-center text-muted py-3">Sin pedidos</td></tr>
                    <tr th:each="pedido : ${pedidos}">
                        <td th:text="${pedido.id}"></td>
                        <td th:text="${#temporals.format(pedido.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                        <td><span class="badge" th:classappend="'text-bg-' + ${pedido.estado.estilo}" th:text="${pedido.estado.descripcion}"></span></td>
                        <td class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(pedido.total, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td class="text-end" th:text="${pedido.puntosOtorgados}"></td>
                        <td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/pedidos/{id}(id=${pedido.id})}">Ver</a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="tab-pane fade" id="pestanaPuntos">
            <div class="table-responsive">
                <table class="table tabla align-middle mb-0">
                    <thead><tr><th>Fecha</th><th>Tipo</th><th>Descripción</th><th class="text-end">Puntos</th><th class="text-end">Saldo</th></tr></thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(movimientos)}"><td colspan="5" class="text-center text-muted py-3">Sin movimientos</td></tr>
                    <tr th:each="movimiento : ${movimientos}">
                        <td th:text="${#temporals.format(movimiento.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                        <td><span class="badge" th:classappend="'text-bg-' + ${movimiento.tipo.estilo}" th:text="${movimiento.tipo.descripcion}"></span></td>
                        <td th:text="${movimiento.descripcion}"></td>
                        <td class="text-end fw-semibold" th:text="${movimiento.puntosConSigno > 0} ? '+' + ${movimiento.puntosConSigno} : ${movimiento.puntosConSigno}"></td>
                        <td class="text-end" th:text="${movimiento.saldoResultante}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="tab-pane fade" id="pestanaCanjes">
            <div class="table-responsive">
                <table class="table tabla align-middle mb-0">
                    <thead><tr><th>#</th><th>Fecha</th><th>Recompensa</th><th>Producto</th><th class="text-end">Puntos</th></tr></thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(canjes)}"><td colspan="5" class="text-center text-muted py-3">Sin canjes</td></tr>
                    <tr th:each="canje : ${canjes}">
                        <td th:text="${canje.id}"></td>
                        <td th:text="${#temporals.format(canje.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${canje.recompensaNombre}"></td>
                        <td th:text="${canje.productoNombre}"></td>
                        <td class="text-end" th:text="${canje.puntosUtilizados}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
<th:block th:replace="~{fragmentos/plantilla :: scripts}"></th:block>
</body>
</html>
