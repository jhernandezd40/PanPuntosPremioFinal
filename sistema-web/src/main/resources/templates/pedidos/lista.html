<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera('Pedidos')}"></head>
<body>
<nav th:replace="~{fragmentos/plantilla :: navegacion('pedidos')}"></nav>
<main class="container">
    <div th:replace="~{fragmentos/plantilla :: mensajes}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 mb-0">Pedidos</h1>
        <a class="btn btn-primario" th:href="@{/pedidos/nuevo}">+ Nuevo pedido</a>
    </div>

    <div class="mb-3 d-flex flex-wrap gap-2">
        <a class="btn btn-sm" th:href="@{/pedidos}"
           th:classappend="${estadoSeleccionado == null} ? 'btn-dark' : 'btn-outline-dark'">Todos</a>
        <a class="btn btn-sm" th:each="estado : ${estados}" th:href="@{/pedidos(estado=${estado})}"
           th:classappend="${estado == estadoSeleccionado} ? 'btn-dark' : 'btn-outline-dark'"
           th:text="${estado.descripcion}"></a>
    </div>

    <div class="card tarjeta">
        <div class="table-responsive">
            <table class="table tabla table-hover align-middle mb-0">
                <thead>
                <tr><th>#</th><th>Cliente</th><th>Creado</th><th>Pagado</th><th>Estado</th><th class="text-end">Total</th><th class="text-end">Puntos</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="8" class="text-center text-muted py-4">No hay pedidos</td></tr>
                <tr th:each="pedido : ${pedidos}">
                    <td class="fw-semibold" th:text="${pedido.id}"></td>
                    <td th:text="${pedido.nombreCliente}"></td>
                    <td class="text-nowrap" th:text="${#temporals.format(pedido.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="text-nowrap" th:text="${pedido.fechaPago != null} ? ${#temporals.format(pedido.fechaPago, 'dd/MM/yyyy HH:mm')} : '—'"></td>
                    <td><span class="badge" th:classappend="'text-bg-' + ${pedido.estado.estilo}" th:text="${pedido.estado.descripcion}"></span></td>
                    <td class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(pedido.total, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td class="text-end" th:text="${pedido.puntosOtorgados}"></td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/pedidos/{id}(id=${pedido.id})}">Ver</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
<th:block th:replace="~{fragmentos/plantilla :: scripts}"></th:block>
</body>
</html>
