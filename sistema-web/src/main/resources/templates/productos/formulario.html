<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera(${formulario.id == null} ? 'Nuevo producto' : 'Editar producto')}"></head>
<body>
<nav th:replace="~{fragmentos/plantilla :: navegacion('productos')}"></nav>
<main class="container">
    <div th:replace="~{fragmentos/plantilla :: mensajes}"></div>

    <h1 class="h3 mb-3" th:text="${formulario.id == null} ? 'Registrar producto' : 'Editar producto'"></h1>

    <div class="card tarjeta p-4" style="max-width: 820px">
        <form th:action="${formulario.id == null} ? @{/productos} : @{/productos/{id}(id=${formulario.id})}"
              th:object="${formulario}" method="post" novalidate>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="categoria">Categoría *</label>
                    <select class="form-select" id="categoria" th:field="*{categoria}" th:if="${formulario.id == null}"
                            th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'">
                        <option th:each="opcion : ${categorias}" th:value="${opcion}" th:text="${opcion.descripcion}"></option>
                    </select>
                    <th:block th:unless="${formulario.id == null}">
                        <input type="hidden" id="categoria" th:field="*{categoria}">
                        <input class="form-control" th:value="${formulario.categoria.descripcion}" disabled>
                    </th:block>
                    <div class="invalid-feedback" th:errors="*{categoria}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="codigo">Código *</label>
                    <input class="form-control" id="codigo" th:field="*{codigo}" placeholder="SAN-004"
                           th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{codigo}"></div>
                </div>
                <div class="col-md-5">
                    <label class="form-label" for="nombre">Nombre *</label>
                    <input class="form-control" id="nombre" th:field="*{nombre}"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="precio">Precio (Q) *</label>
                    <input type="number" step="0.01" min="0" class="form-control" id="precio" th:field="*{precio}"
                           th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{precio}"></div>
                </div>
                <div class="col-md-4 campo-existencia" th:if="${formulario.id == null}">
                    <label class="form-label" for="existencia">Existencia inicial</label>
                    <input type="number" min="0" class="form-control" id="existencia" th:field="*{existencia}"
                           th:classappend="${#fields.hasErrors('existencia')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{existencia}"></div>
                </div>
                <div class="col-md-4" th:unless="${formulario.id == null or formulario.esMenu()}">
                    <label class="form-label">Existencia actual</label>
                    <input class="form-control" th:value="*{existencia}" disabled>
                    <div class="form-text">Use el módulo de inventario para ingresar unidades.</div>
                </div>
            </div>

            <fieldset class="seccion-menu border rounded p-3 mt-4">
                <legend class="float-none w-auto px-2 fs-6 mb-0">Componentes del menú</legend>
                <p class="small text-muted">El menú tiene precio propio. Al venderlo se descuenta una unidad de cada componente.</p>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="sandwichId">Sándwich *</label>
                        <select class="form-select" id="sandwichId" th:field="*{sandwichId}">
                            <option value="">Seleccione...</option>
                            <option th:each="opcion : ${sandwiches}" th:value="${opcion.id}" th:text="${opcion.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="bebidaId">Bebida *</label>
                        <select class="form-select" id="bebidaId" th:field="*{bebidaId}">
                            <option value="">Seleccione...</option>
                            <option th:each="opcion : ${bebidas}" th:value="${opcion.id}" th:text="${opcion.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="acompanamientoId">Acompañamiento *</label>
                        <select class="form-select" id="acompanamientoId" th:field="*{acompanamientoId}">
                            <option value="">Seleccione...</option>
                            <option th:each="opcion : ${acompanamientos}" th:value="${opcion.id}" th:text="${opcion.nombre}"></option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <div class="d-flex gap-2 mt-4">
                <button class="btn btn-primario" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/productos}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
<th:block th:replace="~{fragmentos/plantilla :: scripts}"></th:block>
<script th:src="@{/js/producto.js}"></script>
</body>
</html>
