<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera('Productos')}"></head>
<body>
<nav th:replace="~{fragmentos/plantilla :: navegacion('productos')}"></nav>
<main class="container">
    <div th:replace="~{fragmentos/plantilla :: mensajes}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 mb-0">Productos</h1>
        <a class="btn btn-primario" th:href="@{/productos/nuevo}">+ Registrar producto</a>
    </div>

    <form class="row g-2 mb-3" th:action="@{/productos}" method="get">
        <div class="col-md-5">
            <input type="search" class="form-control" name="q" th:value="${q}" placeholder="Buscar por código o nombre">
        </div>
        <div class="col-md-3">
            <select class="form-select" name="categoria">
                <option value="">Todas las categorías</option>
                <option th:each="categoria : ${categorias}" th:value="${categoria}" th:text="${categoria.descripcion}"
                        th:selected="${categoria == categoriaSeleccionada}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary" type="submit">Filtrar</button>
        </div>
    </form>

    <div class="card tarjeta">
        <div class="table-responsive">
            <table class="table tabla table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th class="text-end">Precio</th>
                    <th class="text-end">Disponible</th>
                    <th class="text-end">Puntos</th>
                    <th>Estado</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="8" class="text-center text-muted py-4">No se encontraron productos</td>
                </tr>
                <tr th:each="producto : ${productos}">
                    <td class="fw-semibold" th:text="${producto.codigo}"></td>
                    <td>
                        <span th:text="${producto.nombre}"></span>
                        <div class="small text-muted" th:if="${producto.categoria.name() == 'MENU'}">
                            <span th:each="componente, estado : ${producto.componentes}"
                                  th:text="${componente.nombre} + (${estado.last} ? '' : ' + ')"></span>
                        </div>
                    </td>
                    <td th:text="${producto.descripcionCategoria}"></td>
                    <td class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(producto.precio, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td class="text-end">
                        <span class="badge"
                              th:classappend="${producto.unidadesDisponibles() == 0} ? 'text-bg-danger' : (${producto.unidadesDisponibles() <= 5} ? 'text-bg-warning' : 'text-bg-light')"
                              th:text="${producto.unidadesDisponibles()}"></span>
                        <div class="small text-muted" th:if="${producto.categoria.name() == 'MENU'}">según componentes</div>
                    </td>
                    <td class="text-end" th:text="${producto.calcularPuntos(1)}"></td>
                    <td>
                        <span class="badge" th:classappend="${producto.activo} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${producto.activo} ? 'Activo' : 'Inactivo'"></span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/productos/{id}/editar(id=${producto.id})}">Editar</a>
                        <form class="d-inline" th:action="@{/productos/{id}/estado(id=${producto.id},activo=${!producto.activo})}" method="post">
                            <button class="btn btn-sm" type="submit"
                                    th:classappend="${producto.activo} ? 'btn-outline-warning' : 'btn-outline-success'"
                                    th:text="${producto.activo} ? 'Desactivar' : 'Activar'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
<th:block th:replace="~{fragmentos/plantilla :: scripts}"></th:block>
</body>
</html>
