spring.application.name=pan-puntos-premios
server.port=${PUERTO:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PUERTO:3306}/${DB_NOMBRE:proyecto_final}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_CLAVE:juanct76}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=PoolPanPuntos
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.sql.init.mode=never

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.web.locale=es_GT
spring.messages.encoding=UTF-8

aplicacion.ejecutor.hilos-minimos=8
aplicacion.ejecutor.hilos-maximos=32
aplicacion.ejecutor.capacidad-cola=500

logging.level.com.panpuntos=INFO
